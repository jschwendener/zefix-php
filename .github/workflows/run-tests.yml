name: Run Pest tests
on:
    push:
        branches: ["main"]
        paths:
            - 'src/**'
            - 'tests/**'
            - '.github/**'
    pull_request:
        branches: ["main"]
        paths:
            - 'src/**'
            - 'tests/**'
            - '.github/**'
    workflow_dispatch:

permissions:
    contents: read

jobs:
    test:
        name: Run Pest tests
        runs-on: ubuntu-latest
        environment: testing

        strategy:
            matrix:
                php-version: ["8.2", "8.3", "8.4"]

        steps:
            - uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php-version }}

            - name: Validate composer.json and composer.lock
              run: composer validate --strict

            - name: Install dependencies
              run: composer update --prefer-dist --no-progress

            - name: Setup .env file with Zefix credentials
              run: |
                  touch .env
                  echo "ZEFIX_USERNAME=${{ secrets.ZEFIX_USERNAME }}" >> .env
                  echo "ZEFIX_PASSWORD=${{ secrets.ZEFIX_PASSWORD }}" >> .env

            - name: Run test suite
              run: composer run-script test
